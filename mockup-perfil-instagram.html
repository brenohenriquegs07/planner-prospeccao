<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planner do Perfil · Prospecção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TEMA · cores em variáveis (claro e escuro)
   ========================================================================= */
:root{
  --bg:#ffffff; --bg2:#fafafa; --bg3:#efefef; --tx:#0c1014; --tx2:#737373; --tx3:#a3a3a3;
  --bd:#dbdbdb; --bd2:#efefef; --link:#00376b; --tag:#00376b;
  --stage:#ece6dc; --stage2:#e2d9cc; --side:#0B3C49; --side-tx:#F3ECE2;
  --ink:#0B3C49; --acc:#C8623A; --acc2:#E58A5E; --linen:#F3ECE2;
  --ok:#2e8b57; --warn:#d18a1a; --bad:#c0392b;
  --sheet:#ffffff; --shadow:0 18px 50px rgba(11,60,73,.18);
  --chip:#f2f2f2; --input:#fafafa;
}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#0f0f0f; --bg3:#1c1c1c; --tx:#f5f5f5; --tx2:#a8a8a8; --tx3:#6f6f6f;
  --bd:#262626; --bd2:#1a1a1a; --link:#e0f1ff; --tag:#8fc4ff;
  --stage:#0b1316; --stage2:#0f1b1f; --side:#0f2329; --side-tx:#F3ECE2;
  --sheet:#141414; --shadow:0 18px 50px rgba(0,0,0,.55);
  --chip:#1f1f1f; --input:#121212;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--tx);background:radial-gradient(1200px 700px at 70% 10%,var(--stage),var(--stage2));-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx)}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =========================================================================
   PALCO: painel lateral (desktop) + moldura do celular
   ========================================================================= */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.side{width:300px;color:var(--ink)}
:root[data-theme="dark"] .side{color:var(--side-tx)}
.side .mark{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:600;font-size:20px}
.side h1{font-family:Fraunces,serif;font-weight:500;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:22px 0 10px}
.side h1 em{color:var(--acc);font-style:italic}
.side p{font-size:13.5px;line-height:1.6;opacity:.8}
.side .acts{display:grid;gap:8px;margin-top:22px}
.side .btn{justify-content:flex-start}
.side .legend{margin-top:22px;display:grid;gap:6px;font-size:12.5px}
.side .legend span{display:flex;align-items:center;gap:8px}
.side .legend i{width:10px;height:10px;border-radius:3px;display:block}
.side .saved{margin-top:18px;font-size:12px;opacity:.65;display:flex;align-items:center;gap:6px}
.side .saved b{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block}

.phone{width:410px;height:min(864px,calc(100vh - 48px));border-radius:58px;padding:11px;background:linear-gradient(145deg,#2a2a2a,#0a0a0a);box-shadow:0 40px 90px rgba(11,60,73,.35),inset 0 0 0 2px #3a3a3a;position:relative;flex:none}
.phone:before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:33px;border-radius:20px;background:#000;z-index:30}
.screen{width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.statusbar{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600}
.statusbar .ic{display:flex;gap:6px;align-items:center}

@media (max-width:1100px){.side{display:none}}
@media (max-width:520px){
  body{overflow:hidden}
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100dvh;border-radius:0;padding:0;background:none;box-shadow:none}
  .phone:before{display:none}
  .screen{border-radius:0}
  .sheet.full{top:0}
  .statusbar{height:env(safe-area-inset-top,0);padding:0;overflow:hidden}
}

/* =========================================================================
   APP: barra superior, conteúdo e navegação inferior
   ========================================================================= */
.topbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 16px;border-bottom:1px solid transparent}
.topbar .who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.topbar .who .glyph{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--ink));display:flex;align-items:center;justify-content:center}
.topbar .tools{display:flex;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s}
.icon-btn:hover{background:var(--bg3)}
.icon-btn:active{transform:scale(.92)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:0}
.bottomnav{height:62px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--bd);background:var(--bg);padding-bottom:4px}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--tx2);transition:color .15s}
.bottomnav button.on{color:var(--tx)}
.bottomnav button.on svg{stroke-width:2.4}
.bottomnav button:active svg{transform:scale(.88)}
.bottomnav svg{transition:transform .12s}

/* =========================================================================
   PERFIL
   ========================================================================= */
.prof{padding:6px 16px 0}
.prof .row1{display:flex;align-items:center;gap:22px}
.avatar{width:86px;height:86px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,var(--acc),var(--acc2),var(--ink),var(--acc));flex:none;position:relative;cursor:pointer}
.avatar .in{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);overflow:hidden;background:var(--ink)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.avatar:hover .cam{opacity:1}
.counts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.counts b{display:block;font-size:17px;font-weight:700}
.counts span{font-size:13px;color:var(--tx)}
.prof .name{font-weight:600;font-size:14px;margin-top:12px}
.prof .cat{font-size:13.5px;color:var(--tx2)}
.prof .bio{font-size:14px;line-height:1.38;white-space:pre-line;margin-top:2px}
.prof .link{font-size:14px;font-weight:600;color:var(--link);display:flex;gap:4px;align-items:center;margin-top:2px}
[contenteditable]{outline:none;border-radius:6px;transition:background .15s,box-shadow .15s;cursor:text}
[contenteditable]:hover{background:var(--bg3)}
[contenteditable]:focus{background:var(--bg3);box-shadow:0 0 0 2px var(--acc2)}
.editnum{cursor:text}
.prof .btns{display:grid;grid-template-columns:1fr 1fr 36px;gap:7px;margin-top:14px}
.btn{height:34px;border-radius:9px;background:var(--bg3);font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;transition:filter .15s,transform .1s,background .15s}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:#fff}
.btn.dark{background:var(--ink);color:var(--linen)}
.btn.ghost{background:transparent;border:1px solid var(--bd)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.side .btn{background:rgba(255,255,255,.55);color:var(--ink);backdrop-filter:blur(6px)}
:root[data-theme="dark"] .side .btn{background:rgba(255,255,255,.07);color:var(--side-tx)}
.hl{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.hl::-webkit-scrollbar{display:none}
.hl .h{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex:none;cursor:pointer}
.hl .ring{width:64px;height:64px;border-radius:50%;padding:2px;border:1px solid var(--bd);transition:transform .15s}
.hl .h:hover .ring{transform:scale(1.04)}
.hl .ring .in{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--ink);display:flex;align-items:center;justify-content:center}
.hl .ring img{width:100%;height:100%;object-fit:cover}
.hl .h span{font-size:12px;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .add .ring .in{background:var(--bg);font-size:28px;font-weight:300}

.ptabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bd);margin-top:8px;position:sticky;top:0;background:var(--bg);z-index:5}
.ptabs button{height:44px;display:flex;align-items:center;justify-content:center;color:var(--tx3);border-bottom:1px solid transparent;transition:color .15s}
.ptabs button.on{color:var(--tx);border-bottom:1.5px solid var(--tx)}
.gridbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:12px;color:var(--tx2);gap:8px}
.seg{display:inline-flex;background:var(--bg3);border-radius:9px;padding:2px}
.seg button{padding:5px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--tx2);transition:background .15s,color .15s}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;user-select:none;-webkit-user-select:none}
.cell{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:var(--bg3);touch-action:pan-y;transition:transform .18s,opacity .18s,filter .18s}
.cell img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cell:hover{filter:brightness(.92)}
.cell .badge{position:absolute;top:7px;right:7px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.cell .when{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:4px}
.cell .when i{width:6px;height:6px;border-radius:50%;display:block}
.cell.dragging{opacity:.25}
.cell.target{outline:3px solid var(--acc);outline-offset:-3px;filter:brightness(1.05)}
.ghost{position:fixed;z-index:999;pointer-events:none;border-radius:10px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.35);transform:scale(1.06) rotate(-2deg);opacity:.95}
.ph{width:100%;height:100%;padding:10px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.ph small{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ph b{font-family:Fraunces,serif;font-weight:500;font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 24px;text-align:center;color:var(--tx2);font-size:14px;line-height:1.5}

/* =========================================================================
   FOLHAS (modais) dentro da tela do celular
   ========================================================================= */
#sheets{position:absolute;inset:0;pointer-events:none;z-index:40}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;pointer-events:auto;box-shadow:var(--shadow)}
.sheet.full{top:52px;max-height:none;border-radius:0}
.sheet .sb{scrollbar-width:none}.sheet .sb::-webkit-scrollbar{width:0}
.sheet.open{transform:none}
.backdrop.open{opacity:1}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--bd);margin:8px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px;border-bottom:1px solid var(--bd2);flex:none}
.sheet .sh h3{font-size:16px;font-weight:700}
.sheet .sb{overflow-y:auto;padding:14px 16px 22px;flex:1}
.sheet .sf{display:flex;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--bd2);flex:none}
.sheet .sf .btn{flex:1}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--bd);background:var(--input);border-radius:10px;padding:10px 11px;font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
.field textarea{resize:vertical;min-height:90px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(229,138,94,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#fff1c2;color:#7a5600;padding:2px 6px;border-radius:5px}
:root[data-theme="dark"] .sug{background:#3d3210;color:#ffd970}

/* prévia do post (estilo feed) */
.post-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post-h .av{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--ink);flex:none}
.post-h .av img{width:100%;height:100%;object-fit:cover}
.post-h b{font-size:13.5px}
.post-h small{display:block;font-size:11.5px;color:var(--tx2)}
.media{position:relative;aspect-ratio:4/5;background:var(--bg3);overflow:hidden}
.media .track{display:flex;height:100%;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.media .track > *{flex:0 0 100%;height:100%}
.media img{width:100%;height:100%;object-fit:cover}
.media .nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.media .nav.l{left:8px}.media .nav.r{right:8px}
.media .count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:12px}
.media .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.dots{display:flex;justify-content:center;gap:4px;padding:8px 0 0;height:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--bd);display:block;transition:background .2s}
.dots i.on{background:#0095f6}
.actions{display:flex;align-items:center;gap:14px;padding:6px 12px 4px}
.actions .sp{flex:1}
.cap{padding:2px 12px 8px;font-size:13.5px;line-height:1.42;white-space:pre-line}
.cap .tags{color:var(--tag)}
.cap .more{color:var(--tx2);cursor:pointer}
.meta-when{padding:0 12px 10px;font-size:11px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.plan{margin:6px 12px 12px;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.plan .r{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd2);font-size:13px;align-items:center}
.plan .r:last-child{border-bottom:0}
.plan .r span:first-child{color:var(--tx2);font-size:12px}
.plan select{border:1px solid var(--bd);background:var(--input);border-radius:8px;padding:5px 8px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--chip)}
.pill i{width:7px;height:7px;border-radius:50%;display:block}
.checks{margin:0 12px 12px}
.checks h4,.sec h4{font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.ck{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:13px;line-height:1.35}
.ck .ico{width:18px;height:18px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px}
.ck.ok .ico{background:var(--ok)}.ck.no .ico{background:var(--bad)}.ck.na .ico{background:var(--tx3)}.ck.warn .ico{background:var(--warn)}
.ck small{display:block;color:var(--tx2);font-size:11.5px}
.ck input{margin-top:2px;accent-color:var(--acc);width:16px;height:16px}
.rot{margin:0 12px 12px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd2);font-size:12.5px;line-height:1.5;white-space:pre-line}

/* =========================================================================
   PÁGINAS: calendário, meta e estratégia
   ========================================================================= */
.page{padding:6px 14px 24px}
.page h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:4px 2px 2px}
.page .sub{font-size:12.5px;color:var(--tx2);margin:0 2px 12px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:15px;text-transform:capitalize}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px;transition:all .15s;background:var(--bg)}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.flabel{font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:2px 2px 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dh{font-size:10.5px;font-weight:700;color:var(--tx3);text-align:center;padding:2px 0 4px}
.cal .d{min-height:58px;border-radius:9px;padding:4px 3px;background:var(--bg2);border:1px solid transparent;cursor:pointer;transition:border .15s,background .15s;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .d:hover{border-color:var(--bd)}
.cal .d.out{opacity:.35}
.cal .d.today .n{background:var(--acc);color:#fff}
.cal .d.sel{border-color:var(--tx)}
.cal .n{font-size:11px;font-weight:600;width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal .ev{font-size:9px;font-weight:700;color:#fff;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden}
.list .day{font-size:12px;font-weight:700;color:var(--tx2);text-transform:capitalize;margin:12px 2px 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:1px solid var(--bd);margin-bottom:6px;background:var(--bg);cursor:pointer;transition:transform .12s,box-shadow .15s}
.item:hover{box-shadow:0 4px 14px rgba(0,0,0,.07)}
.item:active{transform:scale(.99)}
.item .th{width:42px;height:56px;border-radius:7px;overflow:hidden;flex:none;background:var(--bg3)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tx{flex:1;min-width:0}
.item .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{font-size:11.5px;color:var(--tx2);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.item .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
.fab{position:absolute;right:16px;bottom:76px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(200,98,58,.45);z-index:20;transition:transform .15s}
.fab:hover{transform:scale(1.06)}
.fab:active{transform:scale(.94)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--bd2);border-radius:13px;padding:10px 11px}
.kpi small{font-size:11px;color:var(--tx2);font-weight:600}
.kpi b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:11px;color:var(--tx2)}
.prog{height:12px;border-radius:8px;background:var(--bg3);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--ink),var(--acc));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.4;margin-bottom:12px}
.alert.ok{background:rgba(46,139,87,.12);color:var(--ok)}
.alert.warn{background:rgba(209,138,26,.14);color:var(--warn)}
.alert.bad{background:rgba(192,57,43,.12);color:var(--bad)}
.alert.info{background:var(--bg2);color:var(--tx2);border:1px solid var(--bd2)}
.alert b{display:block}
.hist{display:grid;gap:4px;margin-top:8px}
.hist div{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 8px;border-radius:9px;background:var(--bg2)}
.inline{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end}
.inline input{width:100%;border:1px solid var(--bd);background:var(--input);border-radius:10px;padding:9px 10px;font-size:13.5px;outline:none}
.bars .b{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.bars .t{height:10px;border-radius:6px;background:var(--bg3);overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bars .b b{text-align:right;font-weight:700}.bars .b > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut{display:flex;align-items:center;gap:14px}
.donut .ring{width:96px;height:96px;border-radius:50%;flex:none;position:relative}
.donut .ring:after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--bg)}
.donut .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:18px;font-weight:700}
.donut ul{list-style:none;display:grid;gap:5px;font-size:12.5px}
.donut li{display:flex;align-items:center;gap:7px}
.donut li i{width:9px;height:9px;border-radius:3px;display:block}
.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:3px;font-size:10.5px;text-align:center}
.heat div{padding:5px 0;border-radius:6px}
.heat .hd{color:var(--tx3);font-weight:700}
.score{min-width:34px;height:22px;border-radius:11px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;padding:0 7px}
.menu{display:grid;gap:4px}
.menu button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-size:14.5px;font-weight:500;text-align:left;transition:background .15s}
.menu button:hover{background:var(--bg3)}
.menu small{display:block;font-size:12px;color:var(--tx2);font-weight:400}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(30px);background:#111;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:all .3s;z-index:1000;max-width:min(380px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.3);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.erro{background:var(--bad)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>

// reduz a imagem antes de salvar (1080 px de largura, JPEG)
function lerArquivoImagem(file, largura = 1080) {
  return new Promise((ok, erro) => {
    if (!file || !/^image\//.test(file.type)) return erro(new Error('Escolha um arquivo de imagem.'));
    const fr = new FileReader();
    fr.onerror = () => erro(new Error('Não consegui ler o arquivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => erro(new Error('Imagem inválida.'));
      img.onload = () => {
        const esc = Math.min(1, largura / img.width), c = document.createElement('canvas');
        c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- arrastar e soltar no grid (mouse e toque) ---------- */
const drag = { ativo: false };
function moverPost(idOrigem, idDestino) {
  // os posts trocam de lugar; as datas e horários continuam na mesma sequência
  const cron = ordenar(S.posts);
  const slots = cron.map(p => ({ data: p.data, hora: p.hora }));
  const de = cron.findIndex(p => p.id === idOrigem), para = cron.findIndex(p => p.id === idDestino);
  if (de < 0 || para < 0 || de === para) return false;
  const [item] = cron.splice(de, 1); cron.splice(para, 0, item);
  cron.forEach((p, i) => { p.data = slots[i].data; p.hora = slots[i].hora; });
  salvar(); return true;
}
function iniciarArraste(e) {
  const cell = e.target.closest('.cell'); if (!cell || e.button > 0) return;
  drag.cell = cell; drag.id = cell.dataset.id; drag.x0 = e.clientX; drag.y0 = e.clientY; drag.ativo = false; drag.tipo = e.pointerType; drag.mov = false;
  clearTimeout(drag.t);
  if (e.pointerType !== 'mouse') drag.t = setTimeout(() => ativarArraste(e.clientX, e.clientY), 320); // toque: segurar para arrastar
}
function ativarArraste(x, y) {
  if (!drag.cell) return;
  drag.ativo = true; drag.cell.classList.add('dragging');
  const r = drag.cell.getBoundingClientRect(), g = drag.cell.cloneNode(true);
  g.className = 'ghost'; g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
  drag.dx = x - r.left; drag.dy = y - r.top; document.body.appendChild(g); drag.ghost = g; moverFantasma(x, y);
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { }
}
function moverFantasma(x, y) {
  drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
  const alvo = document.elementFromPoint(x, y)?.closest('.cell');
  $$('.cell.target').forEach(c => c !== alvo && c.classList.remove('target'));
  if (alvo && alvo !== drag.cell) alvo.classList.add('target');
  drag.alvo = alvo && alvo !== drag.cell ? alvo : null;
  // rolagem automática perto das bordas
  const v = $('#view').getBoundingClientRect();
  if (y < v.top + 50) $('#view').scrollTop -= 10; else if (y > v.bottom - 50) $('#view').scrollTop += 10;
}
function moverArraste(e) {
  if (!drag.cell) return;
  const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (!drag.ativo) {
    if (drag.tipo === 'mouse' && dist > 6) ativarArraste(e.clientX, e.clientY);
    else if (drag.tipo !== 'mouse' && dist > 10) { clearTimeout(drag.t); drag.cell = null; } // virou rolagem
    return;
  }
  e.preventDefault(); drag.mov = true; moverFantasma(e.clientX, e.clientY);
}
function soltarArraste() {
  clearTimeout(drag.t);
  if (drag.ativo) {
    drag.ghost?.remove(); drag.cell?.classList.remove('dragging'); $$('.cell.target').forEach(c => c.classList.remove('target'));
    if (drag.alvo && moverPost(drag.id, drag.alvo.dataset.id)) { render(); toast('Ordem atualizada. As datas foram reorganizadas.'); }
    drag.bloquearClique = true; setTimeout(() => drag.bloquearClique = false, 60);
  }
  drag.ativo = false; drag.cell = null; drag.alvo = null;
}

  const itens = [
    { k: 'cta', t: 'Legenda com chamada para ação', d: 'Comenta, salva, chama no direct, arrasta...', ok: REGEX_CTA.test(p.legenda) },
    { k: 'tags', t: 'Hashtags (3 a 8)', d: tags ? `${tags} hashtags` : 'Nenhuma hashtag', ok: tags >= 3 && tags <= 8, warn: tags > 8 || (tags > 0 && tags < 3) },
    { k: 'gancho', t: 'Primeira linha forte', d: 'Até 125 caracteres, que é o que aparece antes do "mais"', ok: primeira.length > 0 && primeira.length <= 125, warn: primeira.length > 125 },
    { k: 'tam', t: 'Legenda dentro do limite', d: `${p.legenda.length} de 2.200 caracteres`, ok: p.legenda.length > 0 && p.legenda.length <= 2200 },
    { k: 'arte', t: 'Arte definida', d: temArte ? (p.img ? 'Imagem enviada' : `${p.arquivos.length} arquivo(s) da pasta`) : 'Ainda com placeholder', ok: temArte },
    { k: 'capa', t: 'Capa do Reels', d: p.formato === 'Reels' ? 'Imagem de capa para o grid' : 'Não se aplica', ok: capaReels, na: capaReels === null },
    { k: 'hora', t: 'Data e horário definidos', d: `${fmtCurta(p.data)} às ${p.hora}`, ok: !!(p.data && p.hora) && !(p.sug || []).includes('hora') },
  ];
  const validos = itens.filter(i => !i.na), feitos = validos.filter(i => i.ok).length;
  return { itens, nota: Math.round(feitos / validos.length * 100) };
}
const corNota = n => n >= 85 ? 'var(--ok)' : n >= 60 ? 'var(--warn)' : 'var(--bad)';

function irSlide(d) {
  const m = $('#media'); if (!m) return;
  const n = +m.dataset.n, i = Math.max(0, Math.min(n - 1, +m.dataset.i + d));
  m.dataset.i = i; m.querySelector('.track').style.transform = `translateX(${-i * 100}%)`;
  const c = m.querySelector('.count'); if (c) c.textContent = `${i + 1}/${n}`;
  $$('.dots i').forEach((el, k) => el.classList.toggle('on', k === i));
}
function ligarSwipe(sh) {
  const m = sh.querySelector('#media'); if (!m || +m.dataset.n < 2) return;
  let x0 = null;
  m.addEventListener('pointerdown', e => { x0 = e.clientX; });
  m.addEventListener('pointerup', e => { if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 40) irSlide(dx < 0 ? 1 : -1); x0 = null; });
}

function salvarPost(id) {
  const f = $('#form-post'); if (!f.reportValidity()) return;
  const v = Object.fromEntries(new FormData(f).entries());
  let p = id ? S.posts.find(x => x.id === id) : null;

  const antes = { objetivo: p.objetivo, hora: p.hora };
  Object.assign(p, { titulo: v.titulo.trim(), data: v.data, hora: v.hora, formato: v.formato, status: v.status, pilar: v.pilar.trim() || 'Geral', objetivo: v.objetivo.trim(), legenda: v.legenda, hashtags: v.hashtags.trim(), roteiro: v.roteiro, notas: v.notas });
  // campo revisado pela pessoa deixa de ser "sugestão"
  p.sug = (p.sug || []).filter(c => !(c in antes) || antes[c] === p[c]);
  salvar(); fecharFolha(); render(); toast(id ? 'Post atualizado.' : 'Post criado.');
}
function duplicarPost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return null;
  const novo = JSON.parse(JSON.stringify(p)); novo.id = uid(); novo.titulo = p.titulo + ' (cópia)'; novo.status = 'rascunho';
  if (p.img) { const d = lerImg(p.img); novo.img = null; if (d) { const k = uid(); if (gravarImg(k, d)) novo.img = k; } }
  S.posts.push(novo); salvar(); return novo;
}
function excluirPost(id) {
  const i = S.posts.findIndex(x => x.id === id); if (i < 0) return;
  if (S.posts[i].img) apagarImg(S.posts[i].img);
  S.posts.splice(i, 1); salvar();
}

/* =========================================================================

function postsFiltrados() {
  const f = S.prefs.filtros;
  return ordenar(S.posts).filter(p => (!f.formato.length || f.formato.includes(p.formato)) && (!f.pilar.length || f.pilar.includes(p.pilar)) && (!f.status.length || f.status.includes(p.status)));

function mesAtual() {
  if (S.prefs.calMes) return S.prefs.calMes;
  const prox = ordenar(S.posts).find(p => p.data >= isoDe(hoje())) || ordenar(S.posts)[0];
  return (prox ? prox.data : isoDe(hoje())).slice(0, 7);
}
function telaCalendario() {
  const f = S.prefs.filtros, pilares = [...new Set(S.posts.map(p => p.pilar))];
  const chip = (grupo, v, rot, cor) => `<button class="chip ${f[grupo].includes(v) ? 'on' : ''}" data-act="filtro" data-g="${grupo}" data-v="${esc(v)}">${cor ? `<i style="background:${cor}"></i>` : ''}${esc(rot)}</button>`;
  const lista = postsFiltrados(), nFiltros = f.formato.length + f.pilar.length + f.status.length;
  return `<div class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="seg"><button data-act="cal-vista" data-v="mes" class="${S.prefs.calVista === 'mes' ? 'on' : ''}">Mês</button><button data-act="cal-vista" data-v="semana" class="${S.prefs.calVista === 'semana' ? 'on' : ''}">Semana</button></span>
      <span class="seg"><button data-act="cor-por" data-v="pilar" class="${S.prefs.corPor === 'pilar' ? 'on' : ''}">Cor: pilar</button><button data-act="cor-por" data-v="formato" class="${S.prefs.corPor === 'formato' ? 'on' : ''}">formato</button></span>
    </div>
    <div class="flabel">Formato</div><div class="chips">${FORMATOS.map(x => chip('formato', x, x, COR_FORMATO[x])).join('')}</div>
    <div class="flabel">Pilar</div><div class="chips">${pilares.map(x => chip('pilar', x, x, corPilar(x)[0])).join('')}</div>
    <div class="flabel">Status</div><div class="chips">${Object.entries(STATUS).map(([k, v]) => chip('status', k, v, COR_STATUS[k])).join('')}${nFiltros ? `<button class="chip" data-act="limpar-filtros">Limpar (${nFiltros})</button>` : ''}</div>
    ${S.prefs.calVista === 'mes' ? calendarioMes(lista) : calendarioSemana(lista)}
    <div style="height:70px"></div></div>`;
}
function calendarioMes(lista) {
  const [y, m] = mesAtual().split('-').map(Number), ini = new Date(y, m - 1, 1), fim = new Date(y, m, 0);
  const porDia = {}; lista.forEach(p => (porDia[p.data] = porDia[p.data] || []).push(p));
  const sel = S.prefs.diaSel, hojeIso = isoDe(hoje()), cel = [];
  for (let i = 0; i < ini.getDay(); i++) { const d = new Date(y, m - 1, i - ini.getDay() + 1); cel.push([d, true]); }
  for (let d = 1; d <= fim.getDate(); d++) cel.push([new Date(y, m - 1, d), false]);
  while (cel.length % 7) { const ult = cel[cel.length - 1][0]; cel.push([new Date(ult.getFullYear(), ult.getMonth(), ult.getDate() + 1), true]); }
  const doMes = lista.filter(p => p.data.startsWith(`${y}-${pad(m)}`));
  const doDia = sel ? lista.filter(p => p.data === sel) : [];
  return `<div class="card" style="padding:10px">
    <div class="calhead"><button class="icon-btn" data-act="mes" data-d="-1" title="Mês anterior">${I.voltar}</button><b>${MESES[m - 1]} ${y}</b><button class="icon-btn" data-act="mes" data-d="1" title="Próximo mês" style="transform:scaleX(-1)">${I.voltar}</button></div>
    <div class="cal" id="cal-mes">${DIAS.map(d => `<div class="dh">${d[0]}</div>`).join('')}
    ${cel.map(([d, fora]) => { const iso = isoDe(d), ps = porDia[iso] || []; return `<div class="d ${fora ? 'out' : ''} ${iso === hojeIso ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-act="dia" data-v="${iso}"><span class="n">${d.getDate()}</span>${ps.slice(0, 2).map(p => `<span class="ev" style="background:${corItem(p)}" title="${esc(p.titulo)}">${esc(p.hora.slice(0, 2))}h ${p.formato === 'Reels' ? '▶' : p.formato === 'Carrossel' ? '❐' : '■'}</span>`).join('')}${ps.length > 2 ? `<span class="ev" style="background:var(--tx3)">+${ps.length - 2}</span>` : ''}</div>`; }).join('')}</div>
    <div style="font-size:11.5px;color:var(--tx2);margin:8px 2px 0">${doMes.length} post(s) neste mês com os filtros atuais</div></div>
    ${sel ? `<div class="list"><div class="day"><span>${fmtLonga(sel)}</span><button class="chip" data-act="novo-post" data-data="${sel}">+ Post neste dia</button></div>${listaPosts(doDia)}</div>` : `<div class="list"><div class="day"><span>Próximos posts</span></div>${listaPosts(doMes.filter(p => p.data >= hojeIso).slice(0, 5).length ? doMes.filter(p => p.data >= hojeIso).slice(0, 5) : doMes.slice(0, 5))}</div>`}`;
}
function calendarioSemana(lista) {
  const base = S.prefs.diaSel ? dataDe(S.prefs.diaSel) : dataDe(mesAtual() + '-01');
  const ini = new Date(base); ini.setDate(base.getDate() - base.getDay());
  const dias = Array.from({ length: 7 }, (_, i) => new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i));
  return `<div class="card" style="padding:10px"><div class="calhead"><button class="icon-btn" data-act="semana" data-d="-7">${I.voltar}</button><b>${pad(dias[0].getDate())}/${pad(dias[0].getMonth() + 1)} a ${pad(dias[6].getDate())}/${pad(dias[6].getMonth() + 1)}</b><button class="icon-btn" data-act="semana" data-d="7" style="transform:scaleX(-1)">${I.voltar}</button></div></div>
    <div class="list" id="cal-semana">${dias.map(d => { const iso = isoDe(d), ps = lista.filter(p => p.data === iso); return `<div class="day"><span>${DIAS_LONGOS[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}</span><button class="chip" data-act="novo-post" data-data="${iso}">+</button></div>${ps.length ? listaPosts(ps) : '<div style="font-size:12px;color:var(--tx3);padding:4px 4px 8px">Sem post</div>'}`; }).join('')}</div>`;
}

/* =========================================================================
   TELA 3 · META DE SEGUIDORES

function calcularMeta() {

function graficoMeta(c) {

const COLS_CSV = ['Nº', 'Data', 'Dia', 'Horário', 'Formato', 'Pilar', 'Post', 'Objetivo', 'Status', 'Legenda', 'Hashtags', 'Roteiro do Reels', 'Stories do dia', 'Arquivos', 'Notas', 'Sugestões'];
function gerarCSV() {
  const q = v => { const s = String(v ?? ''); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const linhas = ordenar(S.posts).map((p, i) => [i + 1, fmtCurta(p.data) + '/' + p.data.slice(0, 4), DIAS_LONGOS[dataDe(p.data).getDay()], p.hora, p.formato, p.pilar, p.titulo, p.objetivo, STATUS[p.status], p.legenda, p.hashtags, p.roteiro, p.stories, p.arquivos.join(' | '), p.notas, (p.sug || []).join(', ')]);
  return '﻿' + [COLS_CSV, ...linhas].map(l => l.map(q).join(';')).join('\r\n');
}
function lerCSV(texto) {
  // aceita ; , ou tab, campos entre aspas e quebras de linha dentro das células
  texto = texto.replace(/^﻿/, '');
  const primeira = texto.split(/\r?\n/)[0];
  const sep = [';', ',', '\t'].sort((a, b) => primeira.split(b).length - primeira.split(a).length)[0];
  const linhas = []; let campo = '', linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (aspas) { if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += ch; }
    else if (ch === '"') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; linha.push(campo); campo = ''; if (linha.some(c => c.trim() !== '')) linhas.push(linha); linha = []; }
    else campo += ch;
  }
  linha.push(campo); if (linha.some(c => c.trim() !== '')) linhas.push(linha);

/* ---------- leitura direta do .xlsx (sem bibliotecas) ----------
   O .xlsx é um ZIP de arquivos XML. Lemos o índice do ZIP, descompactamos
   com o DecompressionStream do navegador e juntamos as abas:
   a primeira aba com "Data" é a programação; uma aba com "Legenda" e "Nº"
   (como a aba "Conteúdo") completa legenda, hashtags e roteiro. */
async function lerZip(buf) {
  const dv = new DataView(buf), dec = new TextDecoder();
  let fim = buf.byteLength - 22;
  while (fim >= 0 && dv.getUint32(fim, true) !== 0x06054b50) fim--;
  if (fim < 0) throw new Error('O arquivo não parece ser uma planilha .xlsx.');
  const total = dv.getUint16(fim + 10, true); let p = dv.getUint32(fim + 16, true);
  const itens = {};
  for (let k = 0; k < total; k++) {
    const metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true), nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    itens[dec.decode(new Uint8Array(buf, p + 46, nl))] = { metodo, tam, off }; p += 46 + nl + el + cl;
  }
  return async nome => {
    const it = itens[nome] || itens[nome.replace(/^\//, '')]; if (!it) return null;
    const ini = it.off + 30 + dv.getUint16(it.off + 26, true) + dv.getUint16(it.off + 28, true);
    const dados = new Uint8Array(buf, ini, it.tam);
    if (it.metodo === 0) return dec.decode(dados);
    if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador não abre .xlsx. Salve a planilha como CSV.');
    return new Response(new Blob([dados]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
}
async function linhasDoXLSX(buf) {
  const ler = await lerZip(buf), xml = s => new DOMParser().parseFromString(s, 'application/xml');

  const alvo = {}; [...rels.getElementsByTagNameNS(NS, 'Relationship')].forEach(r => alvo[r.getAttribute('Id')] = r.getAttribute('Target'));
  const ssXml = await ler('xl/sharedStrings.xml');
  const compart = ssXml ? [...xml(ssXml).getElementsByTagNameNS(NS, 'si')].map(si => [...si.getElementsByTagNameNS(NS, 't')].map(t => t.textContent).join('')) : [];
  const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const abas = [];
  for (const s of wb.getElementsByTagNameNS(NS, 'sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let caminho = alvo[rid] || ''; caminho = caminho.startsWith('/') ? caminho.slice(1) : 'xl/' + caminho.replace(/^\.\//, '');
    const doc = await ler(caminho); if (!doc) continue;
    const linhas = [...xml(doc).getElementsByTagNameNS(NS, 'row')].map(row => {
      const l = [];
      [...row.getElementsByTagNameNS(NS, 'c')].forEach(c => {
        const t = c.getAttribute('t'), v = c.getElementsByTagNameNS(NS, 'v')[0]?.textContent ?? '';
        let val = t === 's' ? (compart[+v] ?? '') : t === 'inlineStr' ? [...c.getElementsByTagNameNS(NS, 't')].map(x => x.textContent).join('') : v;
        l[colIdx(c.getAttribute('r') || 'A')] = val;
      });
      return Array.from(l, x => x ?? '');
    }).filter(l => l.some(x => String(x).trim() !== ''));
    abas.push({ nome: s.getAttribute('name'), linhas });
  }
  const temCol = (aba, nome) => aba.linhas[0] && aba.linhas[0].some(c => semAcento(c).startsWith(nome));
  const prog = abas.find(a => temCol(a, 'data') && (temCol(a, 'formato') || temCol(a, 'horario'))) || abas.find(a => temCol(a, 'data'));
  if (!prog) throw new Error('Não encontrei uma aba com a coluna "Data".');
  const linhas = prog.linhas.map(l => [...l]);
  const cont = abas.find(a => a !== prog && temCol(a, 'legenda') && temCol(a, 'n'));
  if (cont) {
    // junta a aba de conteúdo pela coluna Nº
    const cab = cont.linhas[0].map(semAcento), iN = cab.findIndex(c => c === 'nº' || c === 'n' || c === 'no' || c.startsWith('nº'));
    const pega = ['legenda', 'hashtag', 'roteiro'].map(n => cab.findIndex(c => c.startsWith(n)));
    const iNprog = linhas[0].map(semAcento).findIndex(c => c === 'nº' || c === 'n' || c === 'no' || c.startsWith('nº'));
    if (iN >= 0 && iNprog >= 0) {
      const mapa = {}; cont.linhas.slice(1).forEach(l => mapa[String(l[iN]).trim()] = l);
      const nomes = ['Legenda', 'Hashtags', 'Roteiro'];
      pega.forEach((ix, k) => { if (ix >= 0 && !linhas[0].some(c => semAcento(c).startsWith(semAcento(nomes[k]).slice(0, 7)))) { linhas[0].push(nomes[k]); linhas.slice(1).forEach(l => l.push((mapa[String(l[iNprog]).trim()] || [])[ix] ?? '')); } });
    }
  }
  return linhas;
}

function postsDeLinhas(linhas) {
  if (linhas.length < 2) throw new Error('A planilha está vazia ou sem cabeçalho.');

    S.prefs.aba = 'perfil'; S.prefs.gridAba = 'grade'; render();
    await new Promise(r => setTimeout(r, 300));
    const imgsGrid = $$('#grid .cell img'), carregadas = imgsGrid.filter(i => i.complete && i.naturalWidth > 0).length;
    ok('Criativos da pasta img aparecem no grid', imgsGrid.length === S.posts.length && carregadas === imgsGrid.length, `${carregadas} de ${S.posts.length} com arte`);
    ok('Foto de perfil e capas carregadas', $('.avatar img').naturalWidth > 0 && $$('.hl .ring img').every(i => i.naturalWidth > 0));
    try {
      const resp = await fetch('Programa%C3%A7%C3%A3o%20e%20Conte%C3%BAdo%20-%20Instagram.xlsx');
      const lidos = postsDeLinhas(await linhasDoXLSX(await resp.arrayBuffer()));
      const p5 = lidos.find(p => p.data === '2026-10-23');
      ok('Importar a planilha .xlsx', lidos.length === 35 && lidos.every(p => p.arquivos.length && p.arquivos.every(a => CRIATIVOS[a])) && p5 && p5.legenda.length > 20 && p5.hashtags.startsWith('#'), `${lidos.length} posts · ${lidos.reduce((a, p) => a + p.arquivos.length, 0)} artes ligadas`);
    } catch (err) { ok('Importar a planilha .xlsx', false, err.message); }
  } catch (err) { ok('Execução sem exceções', false, err.stack || err.message); }
  ok('Sem erros no console', !(window.__erros || []).length, (window.__erros || []).join(' | '));
  const out = $('#resultado-testes'); out.hidden = false;
  out.textContent = '<<' + JSON.stringify({ total: R.length, falhas: R.filter(r => !r.ok).length, R }) + '>>';
}, 600);
</script>
